# Install once per clone: `pre-commit install`. Run on everything: `pre-commit run -a`.
# terraform hooks use the terraform pinned in mise.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1   # shellcheck 0.11.0, same as mise.toml
    hooks:
      - id: shellcheck

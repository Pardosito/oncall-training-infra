# Checks on every PR and push to main (CONVENTIONS §6). Never needs AWS.
# Each job calls a make target, so `make lint` runs the same checks locally.
# Tool versions come from mise.toml; third-party actions are pinned by commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: "2026.10.21"

jobs:
  terraform:
    name: terraform (fmt, validate, forbidden resources, tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: terraform tflint
      - name: Cache tflint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - run: make lint-tf
        env:
          # tflint --init downloads the AWS ruleset from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}

  k8s:
    name: k8s (kustomize build + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: kustomize kubeconform
      - run: make k8s-validate

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: shellcheck
      - run: make lint-sh

  services:
    name: services (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node pnpm
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm config set store-dir ~/.local/share/pnpm/store
      - run: pnpm install --frozen-lockfile
      - run: make lint-ts

  images:
    name: images (docker build, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make images-build

  checkov:
    name: checkov (soft-fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: uv
      - run: make checkov

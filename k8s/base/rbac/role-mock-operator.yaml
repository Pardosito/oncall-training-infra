# backend-worker: mock-reader + applies the user's fixes (scale, restart) and resets the baseline.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mock-operator
  namespace: mock
  labels:
    app.kubernetes.io/name: mock-operator
    app.kubernetes.io/component: worker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]

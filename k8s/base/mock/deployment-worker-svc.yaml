apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-svc
  namespace: mock
  labels:
    app.kubernetes.io/name: worker-svc
    app.kubernetes.io/component: mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-svc
        app.kubernetes.io/component: mock
    spec:
      serviceAccountName: mock-system
      automountServiceAccountToken: false
      securityContext:
        # The images run as USER node; a numeric uid lets the kubelet verify runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker-svc
          image: registry.invalid/oncall-training/mock-system:unset
          env:
            - name: ROLE
              value: worker-svc
          ports:
            - name: http
              containerPort: 8080
          # /ping, not /health: a broken downstream must not restart healthy pods (ARCHITECTURE §9).
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

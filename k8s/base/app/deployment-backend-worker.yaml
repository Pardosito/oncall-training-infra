apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: app
  labels:
    app.kubernetes.io/name: backend-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  # Singleton: two workers would process the same session twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: backend-worker
      securityContext:
        # The images run as USER node; a numeric uid lets the kubelet verify runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend-worker
          image: registry.invalid/oncall-training/backend:unset
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: oncall-config
          env:
            - name: PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

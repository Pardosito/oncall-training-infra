# DNS name gateway.mock.svc.cluster.local is part of the backend's MOCK_HEALTH_URL_TEMPLATE (cross-repo).
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: mock
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: mock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

# Pinned tool versions. Install everything with `mise install`.
# Bump versions in their own PR.

[tools]
# IaC
terraform = "1.17.0"   # CONVENTIONS §1.2: >= 1.10
tflint = "0.65.0"

# Kubernetes
kubectl = "1.36.5"     # keep within ±1 minor of the EKS cluster version
kustomize = "5.8.3"
kubeconform = "0.8.0"
kind = "0.33.0"
helm = "4.3.1"

# Services (injector, mock-system)
node = "22.23.4"
pnpm = "12.16.1"

# Scripts, hooks and AWS
shellcheck = "0.11.0"
pre-commit = "4.7.0"
aws-cli = "2.39.0"

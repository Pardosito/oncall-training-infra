# ARCHITECTURE §5.3: the internal ALB uses IP targets, so its traffic reaches the backend-api
# pods directly from the ALB's ENIs, which have addresses in the VPC CIDR (terraform/cluster
# locals.tf vpc_cidr). Only the API Gateway VPC link can reach the ALB (D-33).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-api
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 3000
